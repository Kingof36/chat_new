<!-- Thay thế phần div id="friends" trong index.html bằng đoạn này -->
<div id="friends" class="panel view hidden">
  <h2>Bạn bè</h2>
  
  <h3>Tìm kiếm bạn bè</h3>
  <div style="display: flex; gap: 8px; margin-bottom: 16px;">
    <input id="searchFriendInput" placeholder="Nhập tên hoặc email bạn bè..." style="margin-bottom: 0;">
    <button id="searchFriendBtn" style="padding: 0 16px; background: #1877f2; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">Tìm</button>
  </div>
  <div id="searchResults" style="margin-bottom: 20px;"></div>

  <h3>Lời mời kết bạn</h3>
  <div id="requests" style="margin-bottom: 20px;"></div>

  <h3>Danh sách bạn bè</h3>
  <div id="myFriends"></div>
</div>
